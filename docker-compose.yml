services:

  postgres:
    container_name: link-shorter-postgres
    image: postgres
    environment:
      POSTGRES_DB: link
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: my_pass
      PGDATA: /data/postgres
    volumes:
      - ./postgres-data:/data/postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 10

  migrations:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: .
    ports:
      - "8081:8081"
    env_file:
      - .env
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: always


      